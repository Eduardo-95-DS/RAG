# Manual-only retrieval eval gate. Not wired to any push trigger — run it
# on demand via:
#   gcloud builds triggers run rag-gcp-eval-manual --branch=rag-gcp
#
# Deliberately separate from cloudbuild.yaml: retrieval quality doesn't
# change on most pushes (chunking/embeddings/reranker config changes rarely),
# so gating every deploy on this would tax pushes that have nothing to do
# with retrieval. Run this manually after any change to chunk size,
# embedding model, or reranker settings — see README "Retrieval Evaluation".
steps:
  # Pull the FAISS index from GCS so eval runs against the same index
  # Cloud Run actually serves, not a freshly-built one. mkdir first: gsutil's
  # multi-source cp refuses to target a destination that doesn't exist yet
  # (raises "Destination URL must name a directory" instead of creating one).
  - name: "gcr.io/cloud-builders/gsutil"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        mkdir -p faiss_index
        gsutil -m cp -r "gs://edu-rag-nvidia-docs/faiss_index/*" faiss_index/

  # Install deps with uv (same lockfile as the app image — no version
  # drift between what CI evaluates and what Cloud Run runs) and run the
  # eval gate. Single step: installing and running together avoids needing
  # a custom builder image just to get uv onto the base image.
  - name: "python:3.13-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -eu
        apt-get update && apt-get install -y --no-install-recommends libgomp1
        pip install --no-cache-dir uv
        uv sync --locked --no-cache
        # FlashRank reranker (item 7) downloads its ONNX model to this dir.
        # The build runs in /workspace, not /app, so point the cache at a
        # writable path here (the app image bakes it at /app/.flashrank_cache).
        export FLASHRANK_CACHE_DIR=/workspace/.flashrank_cache
        uv run python ci/retrieval_eval.py --fail-under-hit-rate=0.90

# No images built, no deploy — this pipeline only reports pass/fail.
options:
  logging: CLOUD_LOGGING_ONLY
