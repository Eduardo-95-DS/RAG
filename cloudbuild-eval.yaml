# Manual-only retrieval eval gate. Not wired to any push trigger — run it
# on demand via:
#   gcloud builds triggers run rag-gcp-eval-manual --branch=rag-gcp --region=southamerica-east1
#
# Deliberately separate from cloudbuild.yaml: retrieval quality doesn't
# change on most pushes, so gating every deploy on this would tax pushes that
# have nothing to do with retrieval. Run manually after any change to chunking,
# embeddings, the sparse model, or reranker settings — see README.
#
# Item 9: retrieval is served by Qdrant Cloud, so there is NO gsutil FAISS-index
# pull anymore. The eval queries the live Qdrant collection directly. Needs
# QDRANT_URL + QDRANT_API_KEY (Secret Manager).
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/qdrant-url/versions/latest
      env: QDRANT_URL
    - versionName: projects/$PROJECT_ID/secrets/qdrant-api-key/versions/latest
      env: QDRANT_API_KEY

steps:
  - name: "python:3.13-slim"
    entrypoint: "bash"
    secretEnv: ["QDRANT_URL", "QDRANT_API_KEY"]
    args:
      - "-c"
      - |
        set -eu
        apt-get update && apt-get install -y --no-install-recommends libgomp1
        pip install --no-cache-dir uv
        uv sync --locked --no-cache
        # FlashRank + BM42 model caches — writable /workspace path (build isn't
        # in /app; the app image bakes FlashRank at /app/.flashrank_cache).
        export FLASHRANK_CACHE_DIR=/workspace/.flashrank_cache
        uv run python ci/retrieval_eval.py --fail-under-hit-rate=0.90

# No images built, no deploy — this pipeline only reports pass/fail.
options:
  logging: CLOUD_LOGGING_ONLY
