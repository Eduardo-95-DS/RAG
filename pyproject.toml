[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragdemo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "faiss-cpu>=1.12.0",
    "google-cloud-firestore>=2.28.0",
    "google-cloud-storage>=2.18.0",
    "langchain>=0.3.27",
    "langchain-community>=0.3.27",
    "langchain-google-vertexai==2.1.2",
    "langchain-groq>=0.3.8",
    "langchain-openai>=0.3.30",
    "langgraph>=0.6.5",
    "openai>=1.99.9",
    "pydantic>=2.11.7",
    "pypdf>=6.0.0",
    "python-dotenv>=1.1.1",
    "rank-bm25==0.2.2",
    "requests>=2.32.4",
    "sentence-transformers>=5.5.1",
    "streamlit>=1.48.1",
]

# The app imports its own code as "src.config", "src.node", etc. (not
# "ragdemo.config"), so we tell setuptools the installable package is
# literally the src/ directory, not a package named "src" inside it.
[tool.setuptools]
packages = ["src", "src.config", "src.document_ingestion", "src.feedback",
            "src.graph_builder", "src.logging", "src.node", "src.state",
            "src.vectorstore"]
package-dir = {"" = "."}
