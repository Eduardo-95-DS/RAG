[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragdemo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "faiss-cpu>=1.12.0",
    "google-cloud-firestore>=2.28.0",
    "google-cloud-storage>=2.18.0",
    # [evaluation] extra pulls in vertexai.evaluation (EvalTask, predefined
    # metrics) — only used by ci/answer_quality_eval.py, not the app itself.
    # google-cloud-aiplatform is already a transitive dep via
    # langchain-google-vertexai, but without [evaluation] it lacks the eval
    # submodule entirely.
    "google-cloud-aiplatform[evaluation]>=1.148.1",
    "langchain>=0.3.27",
    "langchain-community>=0.3.27",
    # Deprecated class, kept deliberately — see vectorstore.py comment for
    # why (IAM auth consistency + stable text-embedding-005 support).
    # Pinned to 2.1.2, not latest 3.x: 3.x requires langchain-core>=1.3.2,
    # which conflicts with the rest of this project's langchain-core 0.3.x
    # pin (langchain, langchain-groq, etc). Verified 2.1.2 resolves cleanly
    # against the rest of this file; 3.2.4 does not.
    "langchain-google-vertexai==2.1.2",
    "langchain-groq>=0.3.8",
    "langchain-openai>=0.3.30",
    "langgraph>=0.6.5",
    "openai>=1.99.9",
    # Only ci/answer_quality_eval.py builds a DataFrame directly; already a
    # transitive dep via streamlit, made explicit since ci/ scripts shouldn't
    # rely on the app's own transitive dependency graph to happen to include
    # what they need.
    "pandas>=2.2.0",
    "pydantic>=2.11.7",
    "pypdf>=6.0.0",
    "python-dotenv>=1.1.1",
    "rank-bm25==0.2.2",
    "requests>=2.32.4",
    # Cross-encoder reranker only (embeddings use Vertex AI, see above) —
    # still needed for CrossEncoderReranker in vectorstore.py. This is the
    # only reason torch is a dependency at all; see [tool.uv.sources] below
    # for why it's pinned to the CPU-only build.
    "sentence-transformers>=5.5.1",
    "streamlit>=1.48.1",
    "torch>=2.12.0",
]

# The app imports its own code as "src.config", "src.node", etc. (not
# "ragdemo.config"), so we tell setuptools the installable package is
# literally the src/ directory, not a package named "src" inside it.
[tool.setuptools]
packages = ["src", "src.config", "src.document_ingestion", "src.feedback",
            "src.graph_builder", "src.logging", "src.node", "src.state",
            "src.vectorstore"]
package-dir = {"" = "."}

# Force CPU-only torch on every platform. Without this, uv's default
# resolution pulls the full CUDA build on Linux (confirmed via uv.lock:
# torch depends on cuda-bindings/cuda-toolkit on sys_platform == 'linux'),
# which is ~1GB of GPU libraries Cloud Run can't use (no GPU). This mirrors
# the pip --extra-index-url https://download.pytorch.org/whl/cpu flag the
# Dockerfile used before switching to uv — see known_issues.md ("CPU-only
# torch wheel install") for the history (a transient TLS handshake failure
# against this index blocked it for a while; confirmed working 2026-07-13).
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
