steps:
  # Build the image, tagging with the short commit SHA so every build is
  # traceable to the exact commit that produced it (and so Artifact Registry
  # keeps a distinct image per push, not overwriting a fixed tag like ":v3").
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "southamerica-east1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-app:$SHORT_SHA"
      - "-t"
      - "southamerica-east1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-app:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "southamerica-east1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-app"

  # Deploy the SHA-tagged image, not :latest — keeps the deployed revision
  # pinned to a specific, reproducible image even if :latest moves later.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "rag-app"
      - "--image=southamerica-east1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-app:$SHORT_SHA"
      - "--region=southamerica-east1"
      - "--service-account=rag-cloudrun@$PROJECT_ID.iam.gserviceaccount.com"
      # LangSmith tracing: LangChain auto-emits traces when these env vars are
      # present (langsmith ships transitively with langchain — no import needed).
      # --set-secrets replaces the whole secret set when passed, so GROQ stays on
      # this same line. If the LangSmith account is EU-region, also add
      # LANGSMITH_ENDPOINT=https://eu.api.smith.langchain.com to the env-vars
      # below, or auth silently fails.
      - "--set-secrets=GROQ_API_KEY=groq-api-key:latest,LANGSMITH_API_KEY=langsmith-api-key:latest"
      - "--set-env-vars=LANGSMITH_TRACING=true,LANGSMITH_PROJECT=rag-gcp"
      - "--memory=2Gi"
      - "--cpu=2"
      - "--allow-unauthenticated"

images:
  - "southamerica-east1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-app:$SHORT_SHA"
  - "southamerica-east1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-app:latest"

# NOTE: serviceAccount is intentionally NOT declared here. It's already set
# on the trigger itself (rag-gcp-push-deploy uses the dedicated
# rag-cloudbuild@<project-id>.iam.gserviceaccount.com — the legacy default
# {PROJECT_NUMBER}@cloudbuild.gserviceaccount.com was never provisioned on
# this project). A prior attempt at declaring
# it here too, with the exact same value as the trigger, produced
# "invalid value for build.service_account" — contrary to what
# https://docs.cloud.google.com/build/docs/securing-builds/configure-user-specified-service-accounts
# implies (it says a config-level value is merely "ignored" when a trigger
# invokes the build, not that it causes an error). Testing without it.
options:
  logging: CLOUD_LOGGING_ONLY
