# Two-service deploy (item 8): build + push both the API and UI images, deploy
# rag-api first, capture its URL, then deploy rag-ui pointed at it. Only rag-api
# gets the Groq/LangSmith secrets + does the heavy work; rag-ui is a thin client.
#
# Both services share an API_KEY secret: rag-api checks the X-API-Key header,
# rag-ui sends it. This blocks random callers from burning the Groq quota via
# the public /query endpoint (and is the same key a future Slack bot would use).
steps:
  # --- build both images ---
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "Dockerfile.api"
      - "-t"
      - "southamerica-east1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-api:$SHORT_SHA"
      - "-t"
      - "southamerica-east1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-api:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-f"
      - "Dockerfile.ui"
      - "-t"
      - "southamerica-east1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-ui:$SHORT_SHA"
      - "-t"
      - "southamerica-east1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-ui:latest"
      - "."

  # --- push both ---
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "southamerica-east1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-api"]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "southamerica-east1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-ui"]

  # --- deploy rag-api (heavy backend) ---
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "rag-api"
      - "--image=southamerica-east1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-api:$SHORT_SHA"
      - "--region=southamerica-east1"
      - "--service-account=rag-cloudrun@$PROJECT_ID.iam.gserviceaccount.com"
      # Backend gets the Groq + LangSmith secrets AND the shared API_KEY.
      # Item 9: rag-api needs QDRANT_URL + QDRANT_API_KEY (retrieval is Qdrant now).
      # ANTHROPIC_API_KEY is the primary LLM since 2026-08-03; GROQ_API_KEY is
      # still required because gpt-oss-20b remains the cross-provider fallback.
      - "--set-secrets=ANTHROPIC_API_KEY=anthropic-api-key:latest,GROQ_API_KEY=groq-api-key:latest,LANGSMITH_API_KEY=langsmith-api-key:latest,API_KEY=rag-api-key:latest,QDRANT_URL=qdrant-url:latest,QDRANT_API_KEY=qdrant-api-key:latest"
      - "--set-env-vars=LANGSMITH_TRACING=true,LANGSMITH_PROJECT=rag-gcp"
      - "--memory=2Gi"
      - "--cpu=2"
      - "--allow-unauthenticated"

  # --- deploy rag-ui, pointed at rag-api's URL ---
  # rag-api's URL isn't known until it's deployed, so read it back with
  # `services describe` and pass it as BACKEND_URL. rag-ui gets the same
  # API_KEY (to send as X-API-Key) but NONE of the Groq/LangSmith secrets.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - "-c"
      - |
        set -eu
        # $$API_URL / $$(...) are escaped so Cloud Build passes them to bash
        # rather than treating them as build substitutions. $PROJECT_ID and
        # $SHORT_SHA are real Cloud Build substitutions (single $).
        API_URL=$$(gcloud run services describe rag-api \
          --region=southamerica-east1 --format='value(status.url)')
        echo "rag-api URL: $$API_URL"
        gcloud run deploy rag-ui \
          --image=southamerica-east1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-ui:$SHORT_SHA \
          --region=southamerica-east1 \
          --service-account=rag-cloudrun@$PROJECT_ID.iam.gserviceaccount.com \
          --set-secrets=API_KEY=rag-api-key:latest \
          --set-env-vars=BACKEND_URL=$$API_URL \
          --memory=512Mi \
          --cpu=1 \
          --allow-unauthenticated

images:
  - "southamerica-east1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-api:$SHORT_SHA"
  - "southamerica-east1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-api:latest"
  - "southamerica-east1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-ui:$SHORT_SHA"
  - "southamerica-east1-docker.pkg.dev/$PROJECT_ID/rag-repo/rag-ui:latest"

# serviceAccount intentionally NOT declared here — set on the trigger (see the
# note that was in the pre-split cloudbuild.yaml; same reasoning holds).
options:
  logging: CLOUD_LOGGING_ONLY
